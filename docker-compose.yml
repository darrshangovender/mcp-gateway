services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MCP_GATEWAY_REDIS_URL: redis://redis:6379/0
      MCP_GATEWAY_AUDIT_PATH: /var/lib/mcp-gateway/audit.jsonl
    volumes:
      - audit:/var/lib/mcp-gateway
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128m
    restart: unless-stopped

volumes:
  audit:
